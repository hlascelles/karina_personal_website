title: "Karina's website" # the title of the website
url: "https://karina.io" # this URL is the address for absolute links, don't include a slash at the end
baseurl: "" # must be "" (not "/") as "" is what GitHub pages will set
urlimg: "/images/" # this URL points to the images directory, do include a slash at the end
markdown: kramdown
permalink: /:categories/:title/
favicon-32x32: "favicon.ico" #the favicon
highlight: rouge # which code highlighter to use

sass:
  sass_dir: _sass
  style: :compressed

# Exclude these files from your production _site
exclude:
- .sass-cache
- Gemfile
- Gemfile.lock

# Configuration for compress.html that is used in all layouts, for details see http://jch.penibelst.de
compress_html:
  clippings: all
  comments: [ "<!-- ", " -->" ]
  endings: all
  profile: false
  ignore:
    envs: [ development ]
